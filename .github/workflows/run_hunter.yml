name: Crypto Alpha Hunter 24H

on:
  workflow_dispatch:
    inputs:
      job_type:
        description: '手动运行哪个任务？(all / track / project / evolve / dashboard)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - track
          - project
          - evolve
          - dashboard
  schedule:
    - cron: '0 0,12 * * *'   # 每天北京时间 08:00、20:00 嗅探宏观赛道
    - cron: '15 */4 * * *'   # 每 4 小时：高频自我进化 + 极早期项目狙击
    - cron: '0 14 * * 0'     # 每周日北京时间 22:00：深度全量复盘

permissions:
  contents: write

# 防止定时任务与手动任务并发写入 docs/alpha_db.json 导致冲突
concurrency:
  group: crypto-alpha-hunter
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 安装依赖库
        run: pip install -r requirements.txt

      - name: 4. 启动前配置自检
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          TABLE_ID_CONFIG: ${{ secrets.TABLE_ID_CONFIG }}
          TABLE_ID_RADAR: ${{ secrets.TABLE_ID_RADAR }}
          TABLE_ID_ALPHA: ${{ secrets.TABLE_ID_ALPHA }}
          FEISHU_URL: ${{ secrets.FEISHU_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python preflight_check.py

      - name: 5. 执行任务
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          TABLE_ID_CONFIG: ${{ secrets.TABLE_ID_CONFIG }}
          TABLE_ID_RADAR: ${{ secrets.TABLE_ID_RADAR }}
          TABLE_ID_ALPHA: ${{ secrets.TABLE_ID_ALPHA }}
          FEISHU_URL: ${{ secrets.FEISHU_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          JOB_TYPE: ${{ github.event.inputs.job_type }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          # 手动触发使用 job_type；定时任务根据 cron 表达式决定模式
          MODE="${JOB_TYPE:-all}"
          case "$SCHEDULE_CRON" in
            "0 0,12 * * *") MODE="track" ;;
            "15 */4 * * *") MODE="project" ;;
            "0 14 * * 0")   MODE="evolve" ;;
          esac
          echo "▶ 本次运行模式: $MODE"

          # 辅助任务失败只告警，不阻断后续核心狙击任务
          soft_run() {
            local label="$1"
            shift
            if ! python "$@"; then
              echo "::warning title=${label}::${label} 执行失败，已跳过，不影响后续任务"
            fi
          }

          case "$MODE" in
            track)
              soft_run "赛道雷达" job1_track_finder.py
              ;;
            project)
              soft_run "进化回测" job3_self_evolver.py
              python job2_project_hunter.py
              ;;
            evolve)
              soft_run "进化回测" job3_self_evolver.py
              soft_run "赛道雷达" job1_track_finder.py
              python job2_project_hunter.py
              ;;
            dashboard)
              ;;
            *)
              soft_run "进化回测" job3_self_evolver.py
              soft_run "赛道雷达" job1_track_finder.py
              python job2_project_hunter.py
              ;;
          esac

          # 无论哪种模式，最后统一刷新一次看板
          soft_run "看板构建" notifier.py

      - name: 6. 推送看板与进化记忆至 GitHub Pages
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "Crypto-Alpha-Bot"
          git config --global user.email "bot@github.com"

          mkdir -p docs
          git add -A docs

          if git diff --cached --quiet; then
            echo "docs/ 无变化，跳过提交"
            exit 0
          fi

          git commit -m "🧬 Auto-evolve & Update Alpha Sniper Dashboard"

          # 自动生成的文件冲突时保留本次结果（-X theirs 在 rebase 中指本地提交）
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "✅ 推送成功"
              exit 0
            fi
            echo "推送失败，5 秒后重试 ($i/3)..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          echo "❌ 多次重试后仍推送失败"
          exit 1
